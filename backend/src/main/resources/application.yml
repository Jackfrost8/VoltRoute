spring:
  application:
    name: voltroute-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# VoltRoute Application Settings
voltroute:
  jwt:
    secret: ${JWT_SECRET:c3VwZXJfc2VjcmV0X2p3dF9rZXlfZm9yX3ZvbHRyb3V0ZV9sb2NhbF9kZXYxMjM0NTY3ODkw}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  external:
    open-charge-map:
      base-url: ${OPEN_CHARGE_MAP_BASE_URL:https://api.openchargemap.io/v3}
      api-key: ${OPEN_CHARGE_MAP_API_KEY:}
      connect-timeout-ms: ${OPEN_CHARGE_MAP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OPEN_CHARGE_MAP_READ_TIMEOUT_MS:10000}
    open-route-service:
      base-url: ${OPENROUTESERVICE_BASE_URL:https://api.openrouteservice.org}
      api-key: ${OPENROUTESERVICE_API_KEY:}
      connect-timeout-ms: ${OPENROUTESERVICE_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OPENROUTESERVICE_READ_TIMEOUT_MS:10000}
    ml-service:
      base-url: ${ML_SERVICE_URL:http://localhost:8000}
